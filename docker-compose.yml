services:
  xhs-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: xhs-analyzer:latest
    container_name: xhs-analyzer
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8088"
    env_file:
      - .env
    environment:
      - XHS_ANALYZER_PYTHON=/usr/local/bin/python
      - XHS_ANALYZER_HEADLESS=${XHS_ANALYZER_HEADLESS:-true}
    volumes:
      - ./data:/app/data
      - ./browser_data:/app/MediaCrawler-main/browser_data
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/api/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    security_opt:
      - no-new-privileges:true
