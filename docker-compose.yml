services:
  xhs-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: xhs-analyzer:latest
    container_name: xhs-analyzer
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8088"
    env_file:
      - .env
    environment:
      - XHS_ANALYZER_PYTHON=/usr/local/bin/python
    volumes:
      - ./data:/app/data
      - ./browser_data:/app/MediaCrawler-main/browser_data
    shm_size: "1gb"
